<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- 공통 head 영역 : fragments/layout.html 파일 내부의 head 영역 사용.
'상품 목록' -> 브라우저 탭의 제목으로 사용 -->
    <head th:replace="~{fragments/layout :: head(title='상품 목록')}"></head>
    <body>
        <!-- 공통 상단 메뉴 영역 : fragments/layout.html 파일 내부의 header 영역 사용 -->
        <header th:replace="~{fragments/layout :: header}"></header>

        <!-- 공통 상단 메뉴 -->
        <main class="container">
            <!-- 공통 메시지 영역 : 등록완료, 수정완료 등의 메시지 표시 -->
            <div th:replace="~{fragments/layout :: alerts}"></div>
            <h1>상품 목록</h1>
        <!-- 상품 검색 영역 -->
            <form class="search" th:action="@{/products}" method="get">
                <!-- 검색어 입력창 -->
                <input type="text" name="keyword" th:value="${keyword}" placeholder="상품명으로 검색">
                <button class="btn" type="submit">검색</button>
            </form>
            <!-- 검색 결과가 없을 때 -->
            <p class="muted" th:if="${#lists.isEmpty(products)}">검색 결과가 없습니다.</p>
            <!-- 상품 목록 출력 -->
            <div class="grid">
                <a class="card" th:each="p : ${products}" th:href="@{/products/{id}(id=${p.id})}">
                    <!-- 상품을 클릭하면 상세 페이지로 이동 -->
                    <!-- 상품 이미지 -->
                    <div class="thumbnail">
                        <img th:if="${p.imageUrl}" th:src="${p.imageUrl}" alt="상품 이미지">
                        <span th:unless="${p.imageUrl}">이미지 없음</span>
                    </div>
                    <!-- 상품 정보 -->
                    <div class="body">
                        <div class="name" th:text="${p.name}">상품명</div>
                        <div class="price" th:text="${#numbers.formatInteger(p.price, 0, 'COMMA')} + '원'">0원</div>
                        <div class="soldout" th:if="${p.stock == 0}">품절</div>
                        <div class="muted"
                             th:if="${p.stock > 0 and p.stock <= 5}"
                             th:text="'재고 ' + ${p.stock} + '개 남음'">
                        </div>
                    </div>
                </a>
            </div>
        </main>

        <!-- 공통 하단 영역 : fragments/layout.html 파일 내부의 footer 영역 사용 -->
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </body>
</html>
